<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Công thức nấu ăn</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; color: #333; }
    header { border-bottom: 2px solid #e67e22; margin-bottom: 20px; }
    header a { margin-right: 15px; color: #e67e22; text-decoration: none; font-weight: bold; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 10px 15px; margin-bottom: 10px; }
    .tag { background: #fdebd0; padding: 2px 8px; border-radius: 10px; font-size: 13px; }
    .pre { white-space: pre-line; }
    input, select, textarea { width: 100%; padding: 8px; margin: 5px 0 12px; box-sizing: border-box; }
    button { background: #e67e22; color: #fff; border: 0; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    button.del { background: #c0392b; }
  </style>
</head>
<body>
  <header>
    <h1>🍳 Công thức nấu ăn</h1>
    <a href="{{ url_for('index') }}">Trang chủ</a>
    <a href="{{ url_for('add') }}">+ Thêm công thức</a>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
