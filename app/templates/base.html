<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f8">
  <title>{% block title %}Bếp Nhà{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --pink-50: #fff5f8;
      --pink-100: #fce3ec;
      --pink-200: #f8cfdd;
      --pink-500: #df5e91;
      --pink-600: #cf477d;
      --ink: #4d3944;
      --muted: #a08491;
      --white: #fff;
      --shadow: 0 12px 32px rgba(158, 74, 108, .08);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--pink-50);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .site-header {
      min-height: 66px;
      padding: 12px clamp(20px, 4vw, 64px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--white);
      border-bottom: 1px solid var(--pink-200);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--pink-600);
      font-size: 21px;
      font-weight: 750;
      text-decoration: none;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--pink-100);
    }

    .brand-mark svg { width: 23px; height: 23px; }

    .header-link, .button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 19px;
      border: 0;
      border-radius: 999px;
      background: var(--pink-500);
      color: var(--white);
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .header-link:hover, .button:hover {
      background: var(--pink-600);
      box-shadow: 0 6px 16px rgba(207, 71, 125, .2);
      transform: translateY(-1px);
    }

    .header-link svg { width: 17px; height: 17px; }

    main {
      width: 100%;
      min-height: calc(100vh - 128px);
      padding: 22px clamp(20px, 4vw, 64px) 24px;
    }

    .hero {
      margin-bottom: 20px;
      padding: 26px 28px;
      border: 1px solid var(--pink-200);
      border-radius: 22px;
      background: var(--pink-100);
    }

    .hero h1 {
      margin: 0 0 5px;
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 650;
      letter-spacing: -.04em;
    }

    .hero p { margin: 0 0 17px; color: var(--muted); font-size: 16px; }

    .section-heading {
      margin: 0 0 14px;
      font-size: 23px;
      letter-spacing: -.025em;
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 0 0 13px;
    }

    .category-link {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 17px;
      border: 1px solid var(--pink-200);
      border-radius: 999px;
      background: var(--white);
      color: var(--ink);
      font-weight: 650;
      text-decoration: none;
      transition: background .18s ease, border-color .18s ease, color .18s ease;
    }

    .category-link:hover { border-color: var(--pink-500); color: var(--pink-600); }
    .category-link.active { border-color: var(--pink-500); background: var(--pink-500); color: var(--white); }
    .category-link svg { width: 17px; height: 17px; }

    .recipe-count { margin: 0 0 14px; color: var(--muted); font-size: 14px; font-weight: 650; }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .recipe-card {
      overflow: hidden;
      border: 1px solid var(--pink-200);
      border-radius: 19px;
      background: var(--white);
      transition: box-shadow .2s ease, transform .2s ease;
    }

    .recipe-card:hover { box-shadow: var(--shadow); transform: translateY(-3px); }

    .recipe-art {
      height: 98px;
      display: grid;
      place-items: center;
      background: var(--pink-100);
      color: var(--pink-500);
    }

    .recipe-art svg { width: min(100px, 60%); height: 70px; stroke-width: 2.2; }

    .recipe-card-content { padding: 13px 15px 15px; }

    .tag {
      display: inline-flex;
      margin-bottom: 7px;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--pink-100);
      color: var(--pink-600);
      font-size: 13px;
      font-weight: 650;
    }

    .recipe-title {
      display: block;
      margin-bottom: 7px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      text-decoration: none;
    }

    .recipe-title:hover, .recipe-action:hover { color: var(--pink-600); }

    .recipe-description {
      min-height: 40px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .recipe-action {
      color: var(--pink-500);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .empty-state {
      padding: 28px;
      border: 1px dashed var(--pink-200);
      border-radius: 18px;
      background: var(--white);
      color: var(--muted);
      text-align: center;
    }

    .page-card {
      padding: clamp(20px, 4vw, 34px);
      border: 1px solid var(--pink-200);
      border-radius: 22px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--pink-600);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0 0 22px;
      font-size: clamp(26px, 4vw, 34px);
      letter-spacing: -.04em;
    }

    .form-grid { display: grid; gap: 16px; }
    .form-field { display: grid; gap: 7px; }

    .form-field label { font-size: 14px; font-weight: 700; }

    .form-field input, .form-field select, .form-field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--pink-200);
      border-radius: 12px;
      outline: none;
      background: #fffafd;
      color: var(--ink);
      font: inherit;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
      border-color: var(--pink-500);
      box-shadow: 0 0 0 3px rgba(223, 94, 145, .14);
    }

    .form-field textarea { min-height: 128px; resize: vertical; }
    .form-hint { margin: 0; color: var(--muted); font-size: 13px; }
    .form-actions, .detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }

    .button-secondary {
      border: 1px solid var(--pink-200);
      background: var(--white);
      color: var(--ink);
    }

    .button-secondary:hover { border-color: var(--pink-500); background: var(--pink-50); color: var(--pink-600); }
    .button-danger { background: #c94b61; }
    .button-danger:hover { background: #ad344b; }

    .back-link {
      display: inline-flex;
      margin-bottom: 15px;
      color: var(--pink-600);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .detail-header { margin-bottom: 23px; }
    .detail-header .tag { margin: 0 0 10px; }
    .detail-header .page-title { margin-bottom: 0; }

    .detail-sections {
      display: grid;
      grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .detail-section {
      padding: 20px;
      border: 1px solid var(--pink-200);
      border-radius: 16px;
      background: #fffafd;
    }

    .detail-section h2 { margin: 0 0 12px; font-size: 18px; }
    .detail-copy { margin: 0; color: #725c67; line-height: 1.8; white-space: pre-line; overflow-wrap: anywhere; }

    .site-footer {
      padding: 15px 20px;
      border-top: 1px solid var(--pink-200);
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    :focus-visible { outline: 3px solid rgba(207, 71, 125, .4); outline-offset: 3px; }

    @media (max-width: 900px) {
      .recipe-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 600px) {
      .site-header { min-height: 62px; padding: 10px 16px; }
      .brand { gap: 9px; font-size: 19px; }
      .brand-mark { width: 36px; height: 36px; }
      .header-link { min-height: 39px; padding: 8px 13px; font-size: 13px; }
      main { min-height: calc(100vh - 124px); padding: 16px; }
      .hero { padding: 22px 20px; border-radius: 18px; }
      .hero p { font-size: 14px; line-height: 1.5; }
      .recipe-grid { gap: 10px; }
      .recipe-art { height: 78px; }
      .recipe-card-content { padding: 11px; }
      .recipe-title { font-size: 15px; }
      .recipe-description { font-size: 13px; }
      .category-list { gap: 7px; }
      .category-link { padding: 7px 12px; font-size: 13px; }
      .detail-sections { grid-template-columns: 1fr; }
    }

    @media (max-width: 380px) {
      .recipe-grid { grid-template-columns: 1fr; }
      .recipe-art { height: 92px; }
      .header-link { padding: 8px 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="Bếp Nhà - Trang chủ">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.2c1.6 0 2.2 1.2 1.5 2.5 1.4-1 2.8-.5 3.1 1.1 1.6-.3 2.6.7 2.3 2.3 1.4.7 1.4 2.1 0 2.8.3 1.6-.7 2.6-2.3 2.3-.3 1.6-1.7 2.1-3.1 1.1.7 1.3.1 2.5-1.5 2.5s-2.2-1.2-1.5-2.5c-1.4 1-2.8.5-3.1-1.1-1.6.3-2.6-.7-2.3-2.3-1.4-.7-1.4-2.1 0-2.8-.3-1.6.7-2.6 2.3-2.3.3-1.6 1.7-2.1 3.1-1.1C9.8 4.4 10.4 3.2 12 3.2Z"/>
          <circle cx="12" cy="10.5" r="2.2"/>
        </svg>
      </span>
      <span>Bếp Nhà</span>
    </a>
    <a class="header-link" href="{{ url_for('add') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Thêm công thức
    </a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">Bếp Nhà · Flask + MySQL + Docker Compose</footer>
</body>
</html>
